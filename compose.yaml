services:
  postgres:
    image: postgres:15-alpine
    container_name: throughline-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: throughline
    ports:
      - "5432:5432"
    volumes:
      - throughline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d throughline"]
      interval: 5s
      timeout: 5s
      retries: 5

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: throughline-aspire
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"   # dashboard UI     -> http://localhost:18888
      - "4317:18889"    # OTLP/gRPC ingest -> app exports to host :4317

volumes:
  throughline-pgdata:

services:
  postgres:
    image: postgres:15-alpine
    container_name: throughline-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: throughline
    ports:
      - "5432:5432"
    volumes:
      - throughline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d throughline"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  throughline-pgdata:

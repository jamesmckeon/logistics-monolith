name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CONFIGURATION: Release

jobs:
  test:
    name: ${{ matrix.category }} tests
    runs-on: ubuntu-latest
    strategy:
      # Report both categories even if one fails, and run them concurrently.
      fail-fast: false
      matrix:
        # Unit needs no external deps; Integration spins up Postgres via
        # Testcontainers (Docker is preinstalled on ubuntu-latest runners).
        category: [Unit, Integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Throughline.sln

      - name: Build
        run: dotnet build Throughline.sln --configuration "$CONFIGURATION" --no-restore

      - name: Test (${{ matrix.category }})
        # Ryuk (Testcontainers' resource reaper) is unnecessary on ephemeral CI
        # runners and pulling it is an extra network round-trip; skip it.
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: >-
          dotnet test Throughline.sln
          --configuration "$CONFIGURATION"
          --no-build
          --filter "Category=${{ matrix.category }}"
          --logger "trx;LogFileName=${{ matrix.category }}.trx"
          --results-directory ./test-results

      - name: Docker diagnostics
        if: failure() && matrix.category == 'Integration'
        run: |
          docker ps -a
          docker images

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.category }}
          path: ./test-results/*.trx
          if-no-files-found: warn

  # Applies every changeset to an empty database, rolls each one back and applies it again, so a
  # broken --rollback is caught before a deploy ever needs it.
  changelogs:
    name: Changelog rollbacks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the Liquibase image
        run: docker build -t throughline-liquibase db/

      - name: Create schemas
        run: >-
          docker run --rm -i --network host -e PGPASSWORD=postgres postgres:15-alpine
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 < db/create-schemas.sql

      - name: Apply, roll back and re-apply every changeset
        run: |
          for module in orders inventory receiving wolverine; do
            docker run --rm --network host -v "$PWD/db/changelog:/liquibase/changelog" throughline-liquibase \
              --url=jdbc:postgresql://localhost:5432/postgres --username=postgres --password=postgres \
              --show-banner=false --changelog-file="$module/changelog.yaml" --liquibase-schema-name="$module" \
              update-testing-rollback
          done
